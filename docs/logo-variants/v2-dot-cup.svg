<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="V2 Dot Cup">
  <title>Dot Cup</title>
  <!-- 蒸汽：紧贴杯口上方 -->
  <g fill="#FF7A6E">
    <circle cx="50" cy="15" r="2.2"/>
    <circle cx="50" cy="22" r="2.2"/>
  </g>
  <g fill="#5D5FEF">
    <!-- 杯口（宽） -->
    <circle cx="31" cy="33" r="2.7"/><circle cx="38.6" cy="33" r="2.7"/>
    <circle cx="46.2" cy="33" r="2.7"/><circle cx="53.8" cy="33" r="2.7"/>
    <circle cx="61.4" cy="33" r="2.7"/><circle cx="69" cy="33" r="2.7"/>
    <!-- 杯身（收窄） -->
    <circle cx="38.6" cy="43" r="2.7"/><circle cx="46.2" cy="43" r="2.7"/>
    <circle cx="53.8" cy="43" r="2.7"/><circle cx="61.4" cy="43" r="2.7"/>
    <circle cx="46.2" cy="53" r="2.7"/><circle cx="53.8" cy="53" r="2.7"/>
    <!-- 杯碟（比杯口更宽） -->
    <circle cx="28" cy="65" r="2.7"/><circle cx="35.3" cy="65" r="2.7"/>
    <circle cx="42.7" cy="65" r="2.7"/><circle cx="50" cy="65" r="2.7"/>
    <circle cx="57.3" cy="65" r="2.7"/><circle cx="64.7" cy="65" r="2.7"/>
    <circle cx="72" cy="65" r="2.7"/>
  </g>
</svg>
