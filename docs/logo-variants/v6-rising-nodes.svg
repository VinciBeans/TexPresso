<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="V6 Rising Nodes">
  <title>Rising Nodes</title>
  <!-- 上升流：蒸汽节点链 -->
  <g fill="none" stroke="#5D5FEF" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M 30 72 Q 45 70, 52 58"/>
    <path d="M 52 58 Q 60 50, 66 40"/>
    <path d="M 66 40 Q 70 34, 74 26"/>
  </g>
  <g>
    <!-- 基底节点（杯/crema），越升越小直到消散 -->
    <circle cx="30" cy="72" r="6.5" fill="#5D5FEF"/>
    <circle cx="23" cy="63" r="3.6" fill="#5D5FEF"/>
    <circle cx="52" cy="58" r="4.6" fill="#5D5FEF"/>
    <circle cx="66" cy="40" r="3.4" fill="#5D5FEF"/>
    <!-- 刚出炉的火花 -->
    <circle cx="74" cy="26" r="2.6" fill="#FF7A6E"/>
  </g>
</svg>
