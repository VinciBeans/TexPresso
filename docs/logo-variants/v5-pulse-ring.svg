<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="V5 Pulse Ring">
  <title>Pulse Ring</title>
  <!-- 杯子俯视成环 -->
  <circle cx="50" cy="50" r="31" fill="none" stroke="#5D5FEF" stroke-width="3"/>
  <!-- 环内实时编译脉冲线 -->
  <path d="M 26 50 H 37 L 42 40 L 48 60 L 53 50 H 74" fill="none" stroke="#FF7A6E" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
